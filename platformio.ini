; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions_2app.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_I2C_USE_LEGACY_DRIVER=1
    -DBOARD_HAS_PSRAM
    -Isrc
    -Iinclude

lib_deps =
    derdoktor667/DShotRMT@^0.9.5
    bblanchon/ArduinoJson@^7.4.1
    esp32async/ESPAsyncWebServer@^3.8.1
    pololu/VL53L1X@^1.3.1

; pio run -e esp32-s3-devkitc1-n16r8 -j 8 -t upload -t monitor
; pio run -e esp32-s3-devkitc1-n16r8 -t upload -t monitor